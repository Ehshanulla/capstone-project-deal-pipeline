<nav class="navbar navbar-expand-lg navbar-dark bg-dark"
     *ngIf="auth.loggedIn$ | async">

  <div class="container-fluid">

    <a class="navbar-brand" routerLink="/">Deal Pipeline</a>

    <div class="collapse navbar-collapse">

      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/deals">Deals</a>
        </li>

        <li class="nav-item" *ngIf="(auth.role$ | async) === 'ADMIN'">
          <a class="nav-link" routerLink="/admin">Admin</a>
        </li>
      </ul>

      <div class="dropdown">
        <button class="btn btn-outline-light dropdown-toggle" data-bs-toggle="dropdown">
          {{ auth.getUsername() }}
        </button>

        <ul class="dropdown-menu dropdown-menu-end">
          <li><span class="dropdown-item-text">Role: {{ auth.getRole() }}</span></li>
          <li><hr class="dropdown-divider"></li>
          <li>
            <button class="dropdown-item text-danger" (click)="logout()">Logout</button>
          </li>
        </ul>
      </div>


    </div>
  </div>
</nav>
